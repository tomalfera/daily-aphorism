<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Aphorism</title>
  <style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg:#0f0f1a; --bg2:#1a1a2e; --bg3:#222240;
  --text:#e0e0e0; --text2:#999; --text3:#666;
  --accent:#8b5cf6; --gold:#d4a853;
  --border:#2a2a40; --r:12px; --rs:8px;
}
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
nav { display:flex; justify-content:space-between; align-items:center; padding:12px 24px; background:rgba(15,15,26,0.95); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:100; backdrop-filter:blur(12px); }
.nav-brand { font-size:18px; font-weight:700; color:var(--accent); }
.nav-tabs { display:flex; gap:4px; }
.nav-tab { background:none; border:none; color:var(--text2); padding:8px 16px; border-radius:var(--rs); cursor:pointer; font:inherit; font-size:14px; font-weight:500; transition:all .2s; }
.nav-tab:hover,.nav-tab.active { color:var(--text); background:var(--bg3); }
main { max-width:780px; margin:0 auto; padding:24px; }
.daily-card { background:var(--bg2); border:1px solid var(--border); border-radius:var(--r); padding:40px 32px; text-align:center; margin-bottom:24px; }
.daily-day { font-size:13px; color:var(--text3); text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
.daily-text { font-size:24px; font-weight:600; line-height:1.5; margin-bottom:16px; color:var(--text); font-style:italic; }
.daily-author { font-size:16px; color:var(--accent); font-weight:600; }
.daily-source { font-size:13px; color:var(--text2); margin-top:4px; }
.daily-tradition { display:inline-block; margin-top:12px; padding:4px 12px; background:rgba(139,92,246,0.1); border-radius:20px; font-size:12px; color:var(--accent); }
.journal-btn { margin-top:16px; padding:8px 20px; background:var(--accent); color:#fff; border:none; border-radius:var(--rs); cursor:pointer; font:inherit; font-size:13px; font-weight:600; transition:opacity .2s; }
.journal-btn:hover { opacity:.85; }
.gallery-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; flex-wrap:wrap; gap:12px; }
.gallery-header h2 { font-size:22px; font-weight:700; }
#searchInput { background:var(--bg2); border:1px solid var(--border); color:var(--text); padding:10px 16px; border-radius:var(--rs); font:inherit; font-size:14px; width:260px; }
#searchInput:focus { outline:none; border-color:var(--accent); }
.quote-grid { display:grid; gap:12px; }
.quote-card { background:var(--bg2); border:1px solid var(--border); border-radius:var(--r); padding:24px; cursor:pointer; transition:border-color .2s,transform .2s; }
.quote-card:hover { border-color:var(--accent); transform:translateY(-1px); }
.quote-card .text { font-size:15px; line-height:1.6; margin-bottom:12px; font-style:italic; }
.quote-card .author { font-size:14px; font-weight:600; color:var(--accent); }
.quote-card .meta { font-size:12px; color:var(--text3); margin-top:4px; }
.journal-entry { background:var(--bg2); border:1px solid var(--border); border-radius:var(--r); padding:20px 24px; margin-bottom:12px; }
.journal-entry .date { font-size:12px; color:var(--text3); margin-bottom:8px; }
.journal-entry .ref { font-size:13px; color:var(--text2); margin-bottom:8px; font-style:italic; }
.journal-entry .response { font-size:14px; line-height:1.6; color:var(--text); }
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.7); display:flex; align-items:center; justify-content:center; z-index:200; padding:24px; }
.modal { background:var(--bg2); border:1px solid var(--border); border-radius:var(--r); padding:32px; max-width:540px; width:100%; max-height:80vh; overflow-y:auto; }
.modal h3 { font-size:18px; margin-bottom:16px; color:var(--text); }
.modal .quote-snippet { padding:16px; background:var(--bg); border-radius:var(--rs); margin-bottom:16px; font-style:italic; font-size:14px; color:var(--text2); line-height:1.5; }
.modal textarea { width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text); padding:12px; border-radius:var(--rs); font:inherit; font-size:14px; min-height:120px; resize:vertical; margin-bottom:16px; }
.modal textarea:focus { outline:none; border-color:var(--accent); }
.modal-btns { display:flex; gap:8px; justify-content:flex-end; }
.modal-btns button { padding:8px 20px; border-radius:var(--rs); cursor:pointer; font:inherit; font-size:13px; font-weight:600; }
.btn-cancel { background:var(--bg3); color:var(--text2); border:none; }
.btn-save { background:var(--accent); color:#fff; border:none; }
.btn-delete { background:rgba(220,38,38,.2); color:#ef4444; border:none; }
.export-section { margin-top:32px; padding-top:24px; border-top:1px solid var(--border); }
.export-preview { background:var(--bg); border:1px solid var(--border); border-radius:var(--rs); padding:20px 24px; font-family:'SF Mono','Fira Code','Consolas',monospace; font-size:13px; line-height:1.7; white-space:pre-wrap; max-height:400px; overflow-y:auto; }
.export-preview::selection { background:var(--accent); color:#fff; }
.empty { text-align:center; padding:60px 20px; color:var(--text3); }
.empty .icon { font-size:48px; margin-bottom:12px; }
.empty h3 { font-size:18px; color:var(--text2); margin-bottom:8px; }
.toast { position:fixed; bottom:24px; right:24px; background:#22c55e; color:#000; padding:12px 24px; border-radius:var(--rs); font-size:14px; font-weight:600; opacity:0; transform:translateY(16px); transition:all .3s; pointer-events:none; z-index:300; }
.toast.show { opacity:1; transform:translateY(0); }
@media(max-width:600px){
  main { padding:16px; }
  .daily-card { padding:28px 20px; }
  .daily-text { font-size:20px; }
  .gallery-header { flex-direction:column; align-items:stretch; }
  #searchInput { width:100%; }
}
  </style>
</head>
<body>
  <nav>
    <div class="nav-brand">🦉 Daily Aphorism</div>
    <div class="nav-tabs">
      <button class="nav-tab active" data-view="daily">Today</button>
      <button class="nav-tab" data-view="gallery">Gallery</button>
      <button class="nav-tab" data-view="journal">Journal</button>
    </div>
  </nav>
  <main id="main"></main>

  <script>
let quotes=[],journal=[],view='daily',searchTerm='';

document.addEventListener('DOMContentLoaded',()=>{init();});
async function init(){
  journal=JSON.parse(localStorage.getItem('aphorism:journal')||'[]');
  await loadQuotes();
  setupNav();
  render();
}

async function loadQuotes(){
  try{const r=await fetch('quotes.json');if(r.ok)quotes=await r.json();}
  catch(e){console.warn('quotes.json load failed, using fallback');}
  if(!quotes.length)quotes=getFallback();
}

function getFallback(){
  return [
    {day:1,text:"The impediment to action advances action. What stands in the way becomes the way.",author:"Marcus Aurelius",source:"Meditations",tradition:"Stoicism",date:"2026-08-05"},
    {day:2,text:"Tell me, what is it you plan to do with your one wild and precious life?",author:"Mary Oliver",source:"New and Selected Poems",tradition:"Nature",date:"2026-08-04"},
    {day:3,text:"I celebrate myself, and sing myself, and what I assume you shall assume.",author:"Walt Whitman",source:"Song of Myself",tradition:"Transcendentalism",date:"2026-08-03"}
  ];
}

function setupNav(){
  document.querySelectorAll('.nav-tab').forEach(t=>{
    t.addEventListener('click',()=>{
      view=t.dataset.view;
      document.querySelectorAll('.nav-tab').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      render();
    });
  });
}

function render(){
  if(view==='daily')renderDaily();
  else if(view==='gallery')renderGallery();
  else renderJournal();
}

function renderDaily(){
  const today=new Date().toDateString();
  const doy=Math.floor((new Date()-new Date(new Date().getFullYear(),0,0))/86400000);
  const idx=(doy-1)%quotes.length;
  const q=quotes[idx]||quotes[0];
  if(!q){document.getElementById('main').innerHTML='<div class="empty"><div class="icon">📜</div><h3>No quotes yet</h3></div>';return;}
  document.getElementById('main').innerHTML=
    '<div class="daily-card">'+
      '<div class="daily-day">'+today+'</div>'+
      '<div class="daily-text">"'+esc(q.text)+'"</div>'+
      '<div class="daily-author">— '+esc(q.author)+'</div>'+
      (q.source?'<div class="daily-source">'+esc(q.source)+'</div>':'')+
      (q.tradition?'<div class="daily-tradition">'+esc(q.tradition)+'</div>':'')+
      '<br><button class="journal-btn" id="reflectBtn">📝 Reflect on this</button>'+
    '</div>'+
    '<div class="empty"><p style="color:var(--text2);font-size:13px;">Day '+(q.day||'—')+' • Updated daily by Athena 🦉</p></div>';
  document.getElementById('reflectBtn').addEventListener('click',()=>openReflect(q));
}

function renderGallery(){
  const filtered=searchTerm?quotes.filter(q=>(q.text+q.author+(q.source||'')+(q.tradition||'')).toLowerCase().includes(searchTerm)):quotes;
  document.getElementById('main').innerHTML=
    '<div class="gallery-header">'+
      '<h2>📚 All Aphorisms</h2>'+
      '<input type="text" id="searchInput" placeholder="Search quotes, authors…" value="'+esc(searchTerm)+'">'+
    '</div>'+
    '<div class="quote-grid">'+
      (filtered.length===0?'<div class="empty"><div class="icon">🔍</div><h3>No matches</h3></div>':'')+
      filtered.map(q=>
        '<div class="quote-card" data-idx="'+quotes.indexOf(q)+'">'+
          '<div class="text">"'+esc(q.text)+'"</div>'+
          '<div class="author">— '+esc(q.author)+'</div>'+
          '<div class="meta">'+(q.source||'')+(q.tradition?' · '+esc(q.tradition):'')+' · Day '+(q.day||'—')+'</div>'+
        '</div>'
      ).join('')+
    '</div>';
  const inp=document.getElementById('searchInput');
  if(inp)inp.addEventListener('input',()=>{searchTerm=inp.value.toLowerCase();renderGallery();});
  document.querySelectorAll('.quote-card').forEach(card=>{
    card.addEventListener('click',()=>{const q=quotes[parseInt(card.dataset.idx)];if(q)openReflect(q);});
  });
}

function renderJournal(){
  var collateBtn='';
  if(journal.length>0){
    collateBtn='<button class="journal-btn" id="collateBtn" style="margin-bottom:24px;">📋 Collate & Export</button>';
  }
  document.getElementById('main').innerHTML=
    '<h2 style="font-size:22px;font-weight:700;margin-bottom:24px;">📓 Your Reflections</h2>'+
    '<p style="color:var(--text2);font-size:13px;margin-bottom:16px;">'+journal.length+' reflection'+(journal.length!==1?'s':'')+'</p>'+
    collateBtn+
    '<div>'+
    (journal.length===0?'<div class="empty"><div class="icon">📝</div><h3>No reflections yet</h3></div>':'')+
    journal.map((j,i)=>
      '<div class="journal-entry">'+
        '<div class="date">'+new Date(j.savedAt).toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'})+'</div>'+
        '<div class="ref">"'+esc(j.quoteText).substring(0,120)+(j.quoteText.length>120?'…':'')+'" — '+esc(j.author)+'</div>'+
        '<div class="response">'+esc(j.response)+'</div>'+
        '<div style="margin-top:12px;text-align:right;"><button class="btn-delete" data-del="'+i+'" style="padding:4px 12px;border-radius:var(--rs);cursor:pointer;font:inherit;font-size:12px;">Delete</button></div>'+
      '</div>'
    ).join('')+
    '</div>'+
    '<div class="export-section" id="exportSection" style="display:none;">'+
      '<h3 style="margin-bottom:8px;">📋 Collated Reflections</h3>'+
      '<p style="color:var(--text2);font-size:13px;margin-bottom:16px;">Copy the text below and paste into your Google Doc. Submit via Schoology.</p>'+
      '<div class="export-preview" id="exportPreview"></div>'+
      '<button class="journal-btn" id="copyExportBtn" style="margin-top:12px;">📋 Copy to Clipboard</button>'+
      '<span id="copyStatus" style="margin-left:12px;font-size:13px;color:#22c55e;display:none;">Copied!</span>'+
    '</div>';
  document.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click',e=>{e.stopPropagation();journal.splice(parseInt(btn.dataset.del),1);saveJournal();renderJournal();});
  });
  var cb=document.getElementById('collateBtn');
  if(cb)cb.addEventListener('click',collateExport);
  var copyBtn=document.getElementById('copyExportBtn');
  if(copyBtn)copyBtn.addEventListener('click',function(){
    var p=document.getElementById('exportPreview');
    if(!p)return;
    navigator.clipboard.writeText(p.textContent).then(function(){
      var s=document.getElementById('copyStatus');
      if(s){s.style.display='inline';setTimeout(function(){s.style.display='none';},2000);}
    });
  });
}

function openReflect(q){
  const existing=journal.find(j=>j.quoteText===q.text&&j.author===q.author);
  const overlay=document.createElement('div');
  overlay.className='modal-overlay';
  overlay.innerHTML=
    '<div class="modal">'+
      '<h3>📝 Reflect</h3>'+
      '<div class="quote-snippet">"'+esc(q.text)+'" — '+esc(q.author)+'</div>'+
      '<textarea id="reflectText" placeholder="What does this bring up for you? A memory, a question, a reaction…">'+(existing?esc(existing.response):'')+'</textarea>'+
      '<div class="modal-btns">'+
        '<button class="btn-cancel" id="modalCancel">Cancel</button>'+
        '<button class="btn-save" id="modalSave">Save</button>'+
      '</div>'+
    '</div>';
  document.body.appendChild(overlay);
  overlay.querySelector('#modalCancel').addEventListener('click',()=>overlay.remove());
  overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove();});
  overlay.querySelector('#modalSave').addEventListener('click',()=>{
    const text=overlay.querySelector('#reflectText').value.trim();
    if(!text){overlay.remove();return;}
    journal=journal.filter(j=>!(j.quoteText===q.text&&j.author===q.author));
    journal.unshift({quoteText:q.text,author:q.author,date:q.date,response:text,savedAt:new Date().toISOString()});
    if(journal.length>500)journal=journal.slice(0,500);
    saveJournal();
    overlay.remove();
    showToast('Reflection saved');
  });
}

function collateExport(){
  if(!journal.length)return;
  var lines=[
    '═══════════════════════════════════════',
    '  DAILY APHORISM — Reflection Journal',
    '═══════════════════════════════════════',
    '',
    'Total reflections: '+journal.length,
    ''
  ];
  journal.forEach(function(j,i){
    var d=new Date(j.savedAt).toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
    lines.push('───────────────────────────────────────');
    lines.push('  '+(i+1)+'. '+d);
    lines.push('───────────────────────────────────────');
    lines.push('');
    lines.push('"'+j.quoteText+'"');
    lines.push('— '+j.author);
    lines.push('');
    lines.push('My reflection:');
    lines.push(j.response);
    lines.push('');
  });
  lines.push('═══════════════════════════════════════');
  var preview=document.getElementById('exportPreview');
  var section=document.getElementById('exportSection');
  if(preview)preview.textContent=lines.join('\n');
  if(section){section.style.display='block';setTimeout(function(){section.scrollIntoView({behavior:'smooth'});},50);}
}

function saveJournal(){localStorage.setItem('aphorism:journal',JSON.stringify(journal));}

function showToast(msg){
  let toast=document.querySelector('.toast');
  if(!toast){toast=document.createElement('div');toast.className='toast';document.body.appendChild(toast);}
  toast.textContent=msg;toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'),2500);
}

function esc(s){if(!s)return'';return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  </script>
</body>
</html>
